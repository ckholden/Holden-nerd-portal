<!DOCTYPE html>
<html lang="en" class="themed">
<head>
    <!-- Public on purpose (Christian, 11-01): no login, so family can open a shared link. The weather page inside the frame is already public. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dry Creek Airpark Weather - Holden Portal">
    <meta name="author" content="Holden">
    <meta name="robots" content="noindex">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://kj7dts-server.tail34c6a5.ts.net;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Dry Creek Airpark Weather - Holden Portal</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <script src="/theme.js"></script>
    <!-- The three station pages are the same wrapper around the shared weather page (Weather thread owns what's inside the frame) -->
    <style>
        /* Masthead + frame fill the window exactly, so the map's buttons stay on screen; the footer sits below the fold */
        .wx-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            min-height: 520px;
        }

        .webapp-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .webapp-iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        .wx-extra {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="wx-screen">
    <header class="mast-compact">
        <div class="container masthead">
            <h1 class="brand-wrap"><a class="brand" href="/">
                <svg class="brand-mark" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#0b1622"/><path d="M14 46 L48 16 L82 46" fill="none" stroke="#f5b83d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="44" width="10" height="36" rx="2" fill="#fff"/><rect x="57" y="44" width="10" height="36" rx="2" fill="#fff"/><rect x="29" y="58" width="38" height="9" rx="2" fill="#fff"/></svg>
                <span class="brand-name">Holden Portal</span></a></h1>
            <div class="mast-rules"></div>
            <nav class="navbar" aria-label="Main">
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li class="nav-menu">
                        <details>
                            <summary class="active">Weather</summary>
                            <ul class="nav-submenu">
                                <li><a href="/weather">Powell Butte</a></li>
                                <li><a href="/weathercorb">Corbett</a></li>
                                <li><a href="/weatherprineville" aria-current="page">Dry Creek Airpark</a></li>
                            </ul>
                        </details>
                    </li>
                </ul>
            </nav>
            <div class="mast-top">
                <span class="mast-date" id="mastDate"></span>
                <!-- theme.js shows the Day / Night button on pages that can switch -->
                <span><span class="mast-tag">Weather &middot; Radio &middot; Family</span><button type="button" class="theme-toggle" id="themeToggle" hidden>Auto</button></span>
            </div>
        </div>
    </header>

    <main class="webapp-container">
        <!-- local-network: on Tailscale devices Chrome treats the weather server as a private-network address and only lets the frame load if the page hands it this permission.
             fullscreen: lets the map's full-screen button cover the whole screen, masthead included. -->
        <iframe
            class="webapp-iframe"
            data-hp-theme
            title="Dry Creek Airpark Weather"
            src="https://kj7dts-server.tail34c6a5.ts.net/wx/s/drycreek/"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
            allow="geolocation; local-network; fullscreen"
            allowfullscreen>
        </iframe>
    </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Holden Portal. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
