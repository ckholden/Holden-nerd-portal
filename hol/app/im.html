<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IM</title>
<!-- ⚠ Keep in sync with index.html's CSP comment — same connect-src/img-src reasoning,
     even though this popup has no socket of its own (it only needs img-src for avatars
     rendered by holshared.js's buddyIconEl). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://kj7dts-backup.tail34c6a5.ts.net; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
<link rel="stylesheet" href="css/hol-app.css">
</head>
<body>
<div class="window">
<div class="window-inner">
  <div class="titlebar">
    <span class="txt" id="imTitle">IM</span>
    <span class="btns">
      <span class="tbtn" id="imMax" title="Maximize">&#9633;</span>
      <span class="tbtn" id="imClose" title="Close">&times;</span>
    </span>
  </div>
  <div class="menubar"><span><u>F</u>ile</span><span><u>H</u>elp</span></div>
  <div class="sunken convo" id="imLog" style="flex:1"></div>
  <div class="compose">
    <textarea id="imCompose" placeholder="Type a message…" autofocus></textarea>
    <div class="sendrow"><button type="button" id="imSend">Send</button></div>
  </div>
  <div class="status"><div class="sunkenbar" id="imStatus">Connecting…</div></div>
</div>
</div>
<script src="js/holshared.js"></script>
<script src="js/sounds.js"></script>
<script src="js/im.js"></script>
</body></html>
