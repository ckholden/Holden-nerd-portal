<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Holden Family History</title>
<link rel="icon" href="data:,">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f6f1e7;--fg:#2a2118;--muted:#6f6253;--card:#fffaf1;--line:#d9cbb4;--accent:#8a4b2a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1712;--fg:#efe6d8;--muted:#a99a86;--card:#262019;--line:#4a3e30;--accent:#d99a6c;color-scheme:dark}}
html{visibility:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
main{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
p{color:var(--muted);margin:0 0 16px;font-size:.95rem}
label{display:block;font:600 .8rem system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:1.05rem ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--fg);text-transform:uppercase}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:600 1rem system-ui,sans-serif}
#msg{min-height:1.4em;margin-top:10px;font:.9rem system-ui,sans-serif}
.small{font:.8rem system-ui,sans-serif;margin-top:16px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Holden Family History</h1>
  <p>Private family research. Enter the family passphrase once on this device to unlock it.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Family passphrase</label>
    <input id="pw" name="pw" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
    <button type="submit" id="go">Unlock</button>
  </form>
  <div id="msg" role="status"></div>
  <p class="small"><a href="/">Portal</a> · <a href="#" id="out">Sign out and lock this device</a></p>
</main>
<script>
var HX_EMAILS = ["christiankholden@gmail.com"];
firebase.initializeApp({apiKey:"AIzaSyArDL_Cd-xDlmA_92xiaDKXXrSLHPbFUNU",authDomain:"holden-portal.firebaseapp.com",
  projectId:"holden-portal",storageBucket:"holden-portal.firebasestorage.app",messagingSenderId:"659387054117",
  appId:"1:659387054117:web:cf420bfd3a348e5aa6a7cc"});
var $ = function (id) { return document.getElementById(id); };
function db() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open('hx', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('k'); };
    r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
  });
}
function idb(mode, fn) {
  return db().then(function (d) { return new Promise(function (res, rej) {
    var t = d.transaction('k', mode), q = fn(t.objectStore('k')); t.oncomplete = function () { res(q && q.result); };
    t.onerror = function () { rej(t.error); };
  }); });
}
function dec(key, buf) {
  var b = new Uint8Array(buf);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));
}
function openApp() {
  $('msg').textContent = 'Opening…';
  navigator.serviceWorker.register('sw.js', {scope: './'}).then(function () { return navigator.serviceWorker.ready; })
    .then(function () {
      if (navigator.serviceWorker.controller) { location.replace('app.html' + location.hash); return; }
      navigator.serviceWorker.addEventListener('controllerchange', function () { location.replace('app.html' + location.hash); });
    }).catch(function (e) { $('msg').textContent = 'This browser could not open the page: ' + e.message; });
}
function unlock(pw) {
  $('msg').textContent = 'Checking…'; $('go').disabled = true;
  var meta;
  fetch('meta.json', {cache: 'no-cache'}).then(function (r) { return r.json(); }).then(function (m) {
    meta = m;
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  }).then(function (base) {
    var salt = Uint8Array.from(atob(meta.salt), function (c) { return c.charCodeAt(0); });
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: salt, iterations: meta.rounds, hash: 'SHA-256'}, base,
      {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  }).then(function (key) {
    return fetch('check.bin', {cache: 'no-cache'}).then(function (r) { return r.arrayBuffer(); })
      .then(function (b) { return dec(key, b); }).then(function () { return key; });
  }).then(function (key) {
    return idb('readwrite', function (s) { return s.put(key, 'key'); });
  }).then(openApp).catch(function () {
    $('go').disabled = false; $('msg').textContent = 'That passphrase did not work. Check it and try again.';
  });
}
$('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var pw = $('pw').value.trim().toUpperCase().replace(/\s+/g, '');
  if (pw) unlock(pw);
});
$('out').addEventListener('click', function (e) {
  e.preventDefault();
  idb('readwrite', function (s) { return s.delete('key'); }).catch(function () {}).then(function () {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('reset');
    return firebase.auth().signOut();
  }).then(function () { location.replace('/'); });
});
firebase.auth().onAuthStateChanged(function (user) {
  if (!user || HX_EMAILS.indexOf((user.email || '').toLowerCase()) === -1) {
    if (user) firebase.auth().signOut();
    location.replace('/portal-login?next=' + encodeURIComponent(location.pathname));
    return;
  }
  document.documentElement.style.visibility = 'visible';
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle) {
    $('msg').textContent = 'This browser is too old to open the family history.'; return;
  }
  var lock = /[?&]lock\b/.test(location.search);
  idb('readonly', function (s) { return s.get('key'); }).then(function (k) { if (k && !lock) openApp(); }).catch(function () {});
});
</script>
</body>
</html>
